function led(up){
  var ar={},co=[],ev=[],LB=[0,13,25,37],c={};
  function bd(m){return m<13?0:m<25?1:m<37?2:3}
  function ag(k,d){return k.a+Math.floor((new Date(d)-new Date(k.d))/2629800000)}
  function A(r,t,e,q,ak){if(r.data&&r.data<=up&&q)ev.push({d:r.data,t:t,sx:r.sexo,e:e,q:q,ak:ak})}
  (db.est||[]).forEach(function(r){A(r,'+',r.era,r.qtd,r.inv)});
  (db.compra||[]).forEach(function(r){A(r,'+',r.era,r.qtd,r.inv)});
  (db.nasc||[]).forEach(function(r){A(r,'+',ERA[0],r.qtd,r.inv)});
  (db.venda||[]).forEach(function(r){A(r,'-',r.era,r.qtd,r.inv)});
  (db.morte||[]).forEach(function(r){A(r,'-',r.era,r.qtd,r.inv)});
  (db.mov||[]).forEach(function(r){if(r.data&&r.data<=up&&r.qtd)ev.push({d:r.data,t:'m',q:r.qtd,de:r.de,para:r.para})});
  ev.sort(function(x,y){return x.d<y.d?-1:x.d>y.d?1:(x.t=='-')-(y.t=='-')});
  ev.forEach(function(e){
    if(e.t=='m'){if(e.de)ar[e.de]=(ar[e.de]||0)-e.q;if(e.para)ar[e.para]=(ar[e.para]||0)+e.q;return}
    var sg=e.t=='+'?1:-1,ix=ERA.indexOf(e.e);
    if(e.ak)ar[e.ak]=(ar[e.ak]||0)+sg*e.q;
    if(ix<0||!e.sx)return;
    if(sg>0){co.push({sx:e.sx,d:e.d,a:LB[ix],q:e.q});return}
    var rest=e.q,cand=co.filter(function(k){return k.sx==e.sx&&k.q>0&&bd(ag(k,e.d))==ix}).sort(function(x,y){return ag(y,e.d)-ag(x,e.d)});
    cand.forEach(function(k){var t=Math.min(k.q,rest);k.q-=t;rest-=t});
    if(rest>0)co.push({sx:e.sx,d:e.d,a:LB[ix],q:-rest});
  });
  co.forEach(function(k){var kk=k.sx+'|'+ERA[bd(ag(k,up))];c[kk]=(c[kk]||0)+k.q});
  return {c:c,ar:ar};
}

var SY={m:'Sincronização: aguardando. Dados salvos neste aparelho.',col:null,t:null};
function setSy(m){SY.m=m;var e=document.getElementById('sy');if(e)e.textContent=m}
function mergeIn(list){var n=0;list.forEach(function(k){if(!k||!k.id)return;var i=-1;root.clientes.forEach(function(x,j){if(x.id==k.id)i=j});if(i<0){root.clientes.push(k);n++}else if((k.u||0)>(root.clientes[i].u||0)){if(cur&&cur.id==k.id){cur=k;db=k.d}root.clientes[i]=k;n++}});return n}
function push(){clearTimeout(SY.t);SY.t=setTimeout(doPush,1500)}
async function doPush(){
  if(!SY.col){return}
  if(navigator.onLine===false){setSy('Offline: alterações aguardando envio.');return}
  var P=root.clientes.filter(function(k){return(k.u||0)>(k.s||0)});
  if(!P.length){setSy('Sincronizado.');return}
  try{for(var i=0;i<P.length;i++){var k=P[i],u0=k.u,o=JSON.parse(JSON.stringify(k));delete o.s;await SY.col.doc(k.id).set(o);k.s=u0}raw();setSy('Sincronizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.')}
  catch(e){setSy('Não foi possível sincronizar agora. Vamos tentar de novo.')}
}
async function syncInit(){
  try{
    var d=await window.claude.use('db');
    if(!d){setSy('Sincronização indisponível. Dados salvos só neste aparelho.');return}
    SY.col=d.collection('clientes');
    SY.col.onSnapshot(function(sn){
      var L=sn.docs.map(function(x){var o=JSON.parse(JSON.stringify(x.data()));o.s=o.u;return o});
      if(mergeIn(L)){raw();var f=document.activeElement;if(!f||f.tagName!='INPUT'&&f.tagName!='SELECT')draw()}
      doPush();
    },function(){setSy('Sincronização indisponível agora. Dados salvos neste aparelho.')});
    setSy('Conectando...');
  }catch(e){setSy('Sincronização indisponível. Dados salvos só neste aparelho.')}
}

/* Histórico de telas: o botão Voltar volta para a tela de onde a pessoa veio (e não sempre para o início) */
var HIST=[],LASTV=null,LASTLT=null,POPPING=false,_dh=draw;
draw=function(){
  _dh();
  if(v!==LASTV||(LOTE_ATIVO||null)!==LASTLT){
    if(v=='clientes')HIST=[];
    else if(!POPPING&&LASTV!==null){
      var tp=HIST[HIST.length-1];
      if(tp&&tp.v===v&&(tp.lt||null)===(LOTE_ATIVO||null))HIST.pop();
      else{HIST.push({v:LASTV,lt:LASTLT,cur:cur?cur.id:null});if(HIST.length>40)HIST.shift()}
    }
    LASTV=v;LASTLT=LOTE_ATIVO||null;
  }
  var bb=document.querySelector('#bar .back')||document.querySelector('#app .back');
  if(bb&&HIST.length&&/^← (Voltar|Início|Cancelar|Configurações)$/.test(bb.textContent.trim())){
    var pv=HIST[HIST.length-1];
    if(pv.v!='clientes'&&(pv.v!=v||(pv.lt||null)!==(LOTE_ATIVO||null))){
      bb.textContent=(bb.textContent.indexOf('Cancelar')>0?'← Cancelar':'← Voltar');
      bb.onclick=function(){
        var h=HIST.pop();POPPING=true;
        try{
          if(h.cur==null){cur=null;db={}}
          else if(!cur||cur.id!=h.cur){var f=root.clientes.filter(function(k){return k.id==h.cur})[0];if(f){cur=f;db=f.d}}
          if(typeof CAL!='undefined')CAL.y=null;
          v=h.v;LOTE_OPEN=null;draw();
        }finally{POPPING=false}
      };
    }
  }
};
