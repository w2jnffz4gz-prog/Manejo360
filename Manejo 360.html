<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1F4D2E">
<title>Manejo 360</title>
<style>
:root{--bg:#F6F4EC;--card:#fff;--ink:#1B2A21;--mute:#66705F;--g:#1F4D2E;--b:#B8892B;--y:#E9C85C;--r:#b3402a;--line:#E3DDC8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A14;--card:#1A2820;--ink:#EEF2E8;--mute:#9DAA98;--g:#79B98C;--b:#D9B452;--y:#E9C85C;--r:#e57a63;--line:#2A3A2F}}
:root[data-theme="dark"]{--bg:#101A14;--card:#1A2820;--ink:#EEF2E8;--mute:#9DAA98;--g:#79B98C;--b:#D9B452;--y:#E9C85C;--r:#e57a63;--line:#2A3A2F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 50px}
h1{font-size:24px;margin:6px 0 12px}
button{font:inherit}
.back{border:0;background:none;color:var(--g);font-weight:700;font-size:16px;padding:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:left;color:var(--ink);min-height:92px}
.tile b{display:block;font-size:26px}.tile span{font-size:15px;font-weight:600}.tile small{display:block;color:var(--mute)}
.tile.hi{grid-column:1/-1;background:var(--g);color:var(--bg);border:0}.tile.hi small{color:var(--bg);opacity:.85}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.form label{font-size:13px;color:var(--mute)}.form .w{grid-column:1/-1}
input,select{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.btn{grid-column:1/-1;border:0;border-radius:12px;background:var(--g);color:var(--bg);font-weight:700;font-size:17px;min-height:48px}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item .t{flex:1;word-break:break-word}.item small{display:block;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);font-size:22px;padding:4px 8px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--g);background:none;color:var(--bg);padding:0;flex:none}
.done .chk{background:var(--g)}.done .t{text-decoration:line-through;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:18px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}.kv b{white-space:nowrap}.pos{color:var(--g)}.neg{color:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
@media print{.no-print,.back{display:none}}
h1{color:var(--g);border-bottom:2px solid var(--b);padding-bottom:6px}.tile.hi{background:var(--g)}.warn{background:var(--y);color:#3a2f00;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700}h2{color:var(--g)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:6px 0 12px;padding-bottom:6px}.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 14px;font-size:15px}.tabs button.on{background:var(--b);color:#1B2A21;border-color:var(--b);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}.cal .wd{text-align:center;color:var(--mute);font-size:12px;padding:4px 0}
.cd{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cd.hj{border-color:var(--b);font-weight:700}.cd.sel{background:var(--b);color:#1B2A21}.cd.o{visibility:hidden}
.cd i{display:flex;gap:2px;height:7px}.cd u{width:7px;height:7px;border-radius:50%;display:block}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.calnav b{font-size:18px}.calnav .back{font-size:26px;padding:4px 14px}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;font-size:17px;font-weight:600;margin-bottom:8px}
.acc.on{border-color:var(--b);color:var(--g)}.accp{margin:0 0 12px}
details.gd{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px}details.gd summary{font-weight:700;cursor:pointer}details.gd p{margin:8px 0 0}
.mi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:11px 8px 11px 20px;font-size:16px;border-radius:8px}.mi:active{background:var(--bg)}
.dp .acc{padding:12px;font-size:16px;margin-bottom:6px}.mrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mini input{padding:9px;font-size:15px}.mini label{font-size:12px}
.dg{display:grid;grid-template-columns:1fr;gap:12px}.dg>.card{margin:0}
#side{display:none;position:fixed;left:0;top:0;bottom:0;width:264px;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;z-index:40}
@media(min-width:900px){
 main{max-width:760px}
 body.hs #side{display:block}body.hs #mnu{display:none!important}
 body.hs main{margin:0 0 0 264px;max-width:1060px;padding:24px 32px 60px}
 #app>*:not(.dg){max-width:720px}
 .dg{grid-template-columns:1fr 1fr;align-items:start}.dg>.card:last-child{grid-column:1/-1}
 h1{font-size:28px}
}
@media print{#side,#gear,#mnu{display:none!important}body.hs main{margin:0 auto}}
.tile.hi{min-height:0;padding:12px 14px}.tile.hi b{display:inline;font-size:17px}.tile.hi small{display:inline;margin-left:8px}
.note{font-size:13px;color:var(--mute);margin:4px 2px 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--g);outline-offset:2px}
</style>
</head>
<body>
<div id="side"></div><main id="app"></main><button id="gear" aria-label="Configurações" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:50;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;padding:0">⚙️</button><button id="mnu" aria-label="Menu" style="display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:58px;z-index:50;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:700;padding:0 14px">☰ Menu</button>
<script>
var root={clientes:[]},db={},cur=null,v="clientes";
try{var s=JSON.parse(localStorage.getItem("fazenda2"));if(s&&s.clientes)root=s;else if(s&&Object.keys(s).length)root.clientes.push({nome:"Cliente 1",prop:"",mun:"",tel:"",d:s})}catch(e){}
function save(){if(cur)cur.u=Date.now();try{localStorage.setItem("fazenda2",JSON.stringify(root))}catch(e){}push()}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function N(x){return parseFloat(x)||0}
function brl(x){return x.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function num(x,d){return x.toLocaleString("pt-BR",{maximumFractionDigits:d==null?1:d})}
function fd(d){return d?d.split("-").reverse().join("/"):""}
function hoje(){var d=new Date(),z=function(n){return (n<10?'0':'')+n};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function sum(a,f){return a.reduce(function(s,r){return s+f(r)},0)}
var SEX=["Macho","Fêmea"],ERA=["0 a 12 meses","13 a 24 meses","25 a 36 meses","Acima de 36 meses"];
var DT={k:"data",l:"Data",t:"date"};
function areas(){return(db.inv||[]).map(function(r){return r.nome})}
var M={
inv:{t:"Invernadas e áreas",i:"🌾",req:"nome",f:[{k:"nome",l:"Nome (ex: Invernada 1)",t:"text",w:1},{k:"tipo",l:"Tipo",t:"select",w:1,o:["Invernada","Piquete","Reserva Legal","Área de Preservação Permanente (APP)"]},{k:"ha",l:"Área (hectares)",t:"number"}],
  h:function(r){return r.nome},s:function(r){return r.tipo+(r.ha?", "+r.ha+" ha":"")}},
mov:{t:"Movimentação interna",i:"🔀",req:"qtd",f:[DT,{k:"qtd",l:"Quantidade",t:"number"},{k:"lote",l:"Lote / categoria",t:"text",w:1},{k:"de",l:"Sai de",t:"select",o:areas},{k:"para",l:"Vai para",t:"select",o:areas}],
  h:function(r){return r.qtd+" animais: "+esc(r.de)+" para "+esc(r.para)},s:function(r){return fd(r.data)+(r.lote?", "+r.lote:"")}},
compra:{t:"Compra de animais",i:"🛒",req:"qtd",f:[DT,{k:"sexo",l:"Sexo",t:"select",o:SEX},{k:"era",l:"Era",t:"select",o:ERA,w:1},{k:"qtd",l:"Quantidade",t:"number"},{k:"kg",l:"Kg médio do lote",t:"number"},{k:"preco",l:"Preço médio/animal (R$)",t:"number"},{k:"frete",l:"Frete (R$)",t:"number"},{k:"com",l:"Comissão (R$)",t:"number"}],
  c:function(r){r.total=r.qtd*r.preco+r.frete+r.com},h:function(r){return r.qtd+" "+r.sexo+" ("+r.era+") - "+brl(r.total)},s:function(r){return fd(r.data)+", "+num(r.kg)+" kg médio, "+brl(r.preco)+"/animal"}},
venda:{t:"Venda de animais",i:"💵",req:"qtd",f:[DT,{k:"sexo",l:"Sexo",t:"select",o:SEX},{k:"era",l:"Era",t:"select",o:ERA,w:1},{k:"qtd",l:"Quantidade",t:"number"},{k:"peso",l:"Peso médio (kg vivo)",t:"number"},{k:"rc",l:"RC - rendimento de carcaça (%)",t:"number"},{k:"preco",l:"Preço médio/animal (R$)",t:"number"},{k:"precoce",l:"Precoce?",t:"select",o:["Não","Sim"],w:1}],
  c:function(r){r.total=r.qtd*r.preco},h:function(r){return r.qtd+" "+r.sexo+" ("+r.era+") - "+brl(r.total)},s:function(r){return fd(r.data)+", "+num(r.peso)+" kg, RC "+num(r.rc)+"%, precoce: "+r.precoce}},
morte:{t:"Mortes",i:"⚠️",req:"qtd",f:[DT,{k:"qtd",l:"Quantidade",t:"number"},{k:"lote",l:"Lote",t:"text"},{k:"brinco",l:"Brinco individual (opcional)",t:"text",w:1}],
  h:function(r){return r.qtd+" morte(s)"+(r.brinco?" - brinco "+esc(r.brinco):"")},s:function(r){return fd(r.data)+(r.lote?", lote "+r.lote:"")}},
pes:{t:"Pesagens",i:"⚖️",req:"peso",f:[DT,{k:"peso",l:"Peso (kg)",t:"number"},{k:"lote",l:"Lote",t:"text"},{k:"cat",l:"Categoria",t:"select",o:ERA},{k:"sexo",l:"Sexo",t:"select",o:SEX},{k:"brinco",l:"Brinco (opcional)",t:"text",w:1}],
  h:function(r){return num(r.peso)+" kg"+(r.brinco?" - brinco "+esc(r.brinco):"")},s:function(r){return fd(r.data)+", "+(r.lote?"lote "+r.lote+", ":"")+r.cat+", "+r.sexo}},
nasc:{t:"Nascimentos",i:"🐄",req:"qtd",f:[DT,{k:"qtd",l:"Quantidade",t:"number"},{k:"sexo",l:"Sexo",t:"select",o:SEX,w:1}],
  h:function(r){return r.qtd+" nascido(s)"},s:function(r){return fd(r.data)+", "+r.sexo}},
monta:{t:"Estação de monta",i:"📅",req:"nome",f:[{k:"nome",l:"Estação (ex: Monta 2026/27)",t:"text",w:1},{k:"d0",l:"D0",t:"date"},{k:"d8",l:"D8",t:"date"},{k:"d10",l:"D10",t:"date"},{k:"fim",l:"Finalização da estação",t:"date"}],
  h:function(r){return r.nome},s:function(r){return "D0 "+fd(r.d0)+", D8 "+fd(r.d8)+", D10 "+fd(r.d10)+(r.fim?", fim "+fd(r.fim):", em andamento")}},
insumo:{t:"Insumos e minerais",i:"🧂",req:"qtd",f:[DT,{k:"ins",l:"Insumo",t:"select",o:["Núcleo","Milho","Farelo de soja","Outros"]},{k:"qtd",l:"Quantidade (kg)",t:"number"},{k:"valor",l:"Valor total (R$)",t:"number"}],
  h:function(r){return r.ins+": "+num(r.qtd)+" kg"},s:function(r){return fd(r.data)+", "+brl(r.valor)}},
med:{t:"Medicamentos e vacinas",i:"💉",req:"nome",f:[{k:"nome",l:"Medicamento / vacina",t:"text",w:1},{k:"lid",l:"Lote ID do produto",t:"text",w:1},{k:"val",l:"Validade",t:"date"},{k:"data",l:"Data de aplicação",t:"date"}],
  h:function(r){return esc(r.nome)},s:function(r){return "Lote "+r.lid+", validade "+fd(r.val)+", aplicado em "+fd(r.data)}},
plan:{t:"Planejamento",i:"🗓️",req:"desc",chk:1,f:[{k:"per",l:"Período",t:"select",o:["Semanal","Quinzenal","Mensal","Semestral","Anual"]},{k:"prazo",l:"Prazo",t:"date"},{k:"desc",l:"O que fazer",t:"text",w:1}],
  h:function(r){return esc(r.desc)},s:function(r){return r.per+", até "+fd(r.prazo)}},
visita:{t:"Visitas técnicas",i:"📝",req:"tema",f:[DT,{k:"prox",l:"Próxima visita",t:"date"},{k:"tema",l:"Assunto da visita",t:"text",w:1},{k:"rec",l:"Recomendações ao produtor",t:"text",w:1}],
  h:function(r){return esc(r.tema)},s:function(r){return fd(r.data)+(r.rec?", "+r.rec:"")+(r.prox?", próxima em "+fd(r.prox):"")}},
fin:{t:"Despesas e receitas",i:"💰",req:"valor",f:[DT,{k:"valor",l:"Valor (R$)",t:"number"},{k:"desc",l:"Descrição",t:"text",w:1},{k:"tipo",l:"Tipo",t:"select",w:1,o:["Despesa (COE)","Outro custo (COT)","Receita"]}],
  h:function(r){return esc(r.desc)+" - "+brl(r.valor)},s:function(r){return fd(r.data)+", "+r.tipo}}
};
var ORDEM=["visita","inv","mov","compra","venda","morte","pes","nasc","monta","insumo","med","plan","fin"];
function $(h){var d=document.createElement("div");d.innerHTML=h;return d.firstElementChild}
function draw(){var a=document.getElementById("app");a.innerHTML="";window.scrollTo(0,0);
  if(v=="clientes"){clientes(a);agenda(a)}else if(v=="rel")rel(a);else if(v=="gmd")gmd(a);else if(v=="monta")monta(a);else if(v=="edit")edit(a);else if(v=="rec")rec(a);else if(v=="cal")cal(a);else if(v=="cfg")cfg(a);else if(v=="rapido")rapido(a);else if(v=="mapa")mapa(a);else if(v=="ajuda")ajuda(a);else if(v=="boas")boas(a);else if(v=="rota")rota(a);else if(v=="iatf")iatf(a);else if(v=="mfolder")mfolder(a);else if(v=="mstep")mstep(a);else if(v=="ag")ag(a);else if(v=="cust")cust(a);else if(v=="home")home(a);else if(v=="reb")reb(a);else if(v=="ind")ind(a);else mod(a,v)}
function go(x){v=x;if(x=="clientes"){cur=null;PM=false}if(x=="monta")MS.i=null;draw()}
function clientes(a){
  a.appendChild($('<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">'+LOGO+'<div><div style="font-size:22px;font-weight:800">Manejo 360</div><div class="lbl" style="color:var(--mute);font-size:clamp(9px,2.85vw,11.5px);font-weight:600;letter-spacing:.4px;white-space:nowrap">ASSESSORIA E GESTÃO DE FAZENDAS</div></div></div>'));a.appendChild($("<h1>Meus clientes</h1>"));
  pedidos(a);
  var n=root.clientes.length,fp=$('<div class="card mini" style="margin-bottom:10px"></div>');
  var tb=$('<div style="display:flex;gap:8px;margin-bottom:10px"></div>');
  var nb=$('<button class="btn" style="min-height:40px;font-size:clamp(11px,3.4vw,14px);padding:0 10px;white-space:nowrap;flex:1;min-width:0">➕ Novo cliente</button>');
  var rb=$('<button class="btn" style="min-height:40px;font-size:clamp(11px,3.4vw,14px);padding:0 10px;white-space:nowrap;flex:1;min-width:0;background:var(--card);color:var(--ink);border:1px solid var(--line)">🗺️ Roteiro da semana</button>');
  rb.onclick=function(){nv('rota')};
  tb.append(nb,rb);a.appendChild(tb);
  var f=$('<div class="form" style="margin:0"><div class="w"><label>Nome do produtor</label><input id="c_n"></div><div class="w"><label>Propriedade</label><input id="c_p"></div><div class="w"><label>Município</label><input id="c_m"></div></div>');
  var mais=$('<details style="margin:6px 0 10px"><summary style="cursor:pointer;color:var(--g);font-weight:700">+ Mais dados (opcional)</summary><div class="form" style="margin-top:8px"><div><label>Telefone</label><input id="c_t" type="tel"></div><div><label>CPF ou CNPJ</label><input id="c_d"></div><div><label>Número do CAR</label><input id="c_c"></div><div><label>Área total, ha</label><input id="c_a" inputmode="decimal"></div><div><label>Inscrição estadual</label><input id="c_i"></div><div><label>NIRF/ITR</label><input id="c_n2"></div><div class="w"><label>Região ou referência (ex: BR-262 km 30)</label><input id="c_g"></div></div></details>');
  var sv=$('<button class="btn" style="width:100%;min-height:42px;font-size:16px">Cadastrar cliente</button>');
  sv.onclick=function(){
    var g=function(id){var e=fp.querySelector('#'+id);return e?e.value.trim():''},nm=g('c_n');
    if(!nm||!g('c_p')||!g('c_m')){say('Preencha o nome do produtor, a propriedade e o município. Os demais campos são opcionais.');return}
    root.clientes.push({nome:nm,prop:g('c_p'),mun:g('c_m'),tel:g('c_t'),doc:g('c_d'),car:g('c_c'),area:g('c_a'),ie:g('c_i'),nirf:g('c_n2'),reg:g('c_g'),id:uid(),u:Date.now(),d:{}});
    NC=false;save();draw();
  };
  fp.append(f,mais,sv);fp.style.display=(NC||!n)?'block':'none';a.appendChild(fp);
  nb.onclick=function(){NC=!NC;fp.style.display=NC?'block':'none';if(NC)fp.querySelector('#c_n').focus()};
  var box=$('<div class="card" style="padding:4px 14px 8px"></div>');
  function lista(){
    box.innerHTML='';
    var q=(QC||'').toLowerCase();
    var L=root.clientes.slice().sort(function(x,y){return String(x.nome).localeCompare(String(y.nome),'pt',{sensitivity:'base'})}).filter(function(k){return !q||((k.nome||'')+' '+(k.prop||'')+' '+(k.mun||'')).toLowerCase().indexOf(q)>=0});
    if(!L.length){box.innerHTML='<div class="empty">'+(n?'Nenhum cliente encontrado.':'Nenhum cliente ainda. Cadastre acima.')+'</div>';return}
    var ant='';
    L.forEach(function(k){
      var l=ini(k.nome);
      if(l!=ant){ant=l;box.insertAdjacentHTML('beforeend','<div style="font-weight:800;color:var(--b);font-size:14px;margin:10px 0 0;border-bottom:1px solid var(--line)">'+l+'</div>')}
      var e=$('<div class="item"><button class="back" style="flex:1;text-align:left;color:var(--ink)"><b>'+esc(k.nome)+'</b><small>'+esc(k.prop||'')+(k.mun?' - '+esc(k.mun):'')+'</small></button><button class="x" aria-label="Excluir">×</button></div>');
      e.children[0].onclick=function(){cur=k;db=k.d;TAB="";go("home")};
      e.children[1].onclick=function(){ask("Excluir "+k.nome+" e todos os dados dele?",function(){root.clientes.splice(root.clientes.indexOf(k),1);save();draw()})};
      box.appendChild(e);
    });
  }
  if(n>=5){var sb=$('<input type="search" placeholder="🔍 Buscar cliente" style="margin-bottom:10px">');sb.value=QC;sb.oninput=function(){QC=sb.value;lista()};a.appendChild(sb)}
  lista();a.appendChild(box);
}
var NC=false,QC='';
function ini(n){var c=String(n||'#').normalize('NFD').replace(/[\u0300-\u036f]/g,'').charAt(0).toUpperCase();return /[A-Z]/.test(c)?c:'#'}
function y12(k){var ago=Date.now()-365*864e5;return (db[k]||[]).filter(function(r){return r.data&&new Date(r.data).getTime()>=ago})}
function pcard(titulo,html,dest){var c=$('<div class="card" style="cursor:pointer"><h3 style="margin:0 0 6px">'+titulo+'</h3>'+html+'</div>');c.onclick=function(){go(dest)};return c}
function home(a){
  var bk=$('<button class="back">← Meus clientes</button>');bk.onclick=function(){go('clientes')};

function mergeIn(list){var n=0;list.forEach(function(k){if(!k||!k.id)return;var i=-1;root.clientes.forEach(function(x,j){if(x.id==k.id)i=j});if(i<0){root.clientes.push(k);n++}else if((k.u||0)>(root.clientes[i].u||0)){if(cur&&cur.id==k.id){cur=k;db=k.d}root.clientes[i]=k;n++}});return n}

async function doPush(){
  if(!SY.col){return}

  var P=root.clientes.filter(function(k){return(k.u||0)>(k.s||0)});
  if(!P.length){setSy('Sincronizado.');return}
  try{for(var i=0;i<P.length;i++){var k=P[i],u0=k.u,o=JSON.parse(JSON.stringify(k));delete o.s;await SY.col.doc(k.id).set(o);k.s=u0}raw();setSy('Sincronizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.')}

}
async function syncInit(){
  try{
    var d=await window.claude.use('db');

    SY.col=d.collection('clientes');

      var L=sn.docs.map(function(x){var o=JSON.parse(JSON.stringify(x.data()));o.s=o.u;return o});

}
